        <main class="planner-main">

        <section class="planner-heading">
            <h1>Academic Planner</h1>
            <p>Plan your semester. Plan your future.</p>
        </section>

        <section class="planner-content">

            <form class="task-form" id="taskForm">

                <label for="taskInput">Add a task</label>

                <div class="task-input-wrapper">
                    <span class="plus-icon">+</span>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Start typing your task here.."
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" class="add-task-btn">
                    Add
                </button>

            </form>

            <div class="task-panel">

                <h2 id="taskPanelTitle">Pending Tasks</h2>

                <div id="taskList" class="task-list">

                    <p class="empty-message">No tasks yet</p>

                </div>

            </div>

        </section>

    </main>
