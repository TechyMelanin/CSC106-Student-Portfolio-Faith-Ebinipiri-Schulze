      <main class="contact-main">

        <section class="contact-heading">
            <h1>Let’s Talk</h1>
            <p>Have an idea? Let’s build it</p>
        </section>

        <section class="contact-content">

            <!-- CONTACT FORM -->
            <div class="contact-form-container" id="contactFormContainer">

                <form id="contactForm" novalidate>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="John Doe"
                            required
                        >
                        <small class="error-message" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="xyz@company.com"
                            required
                        >
                        <small class="error-message" id="emailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="08012345678"
                            inputmode="numeric"
                            required
                        >
                        <small class="error-message" id="phoneError"></small>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            name="message"
                            placeholder="Type in your request"
                            required
                        ></textarea>
                        <small class="error-message" id="messageError"></small>
                    </div>

                    <button type="submit" class="submit-btn">
                        Submit
                    </button>

                </form>

            </div>

            <!-- SUCCESS MESSAGE -->
            <div class="contact-form-container success-message"
                 id="successMessage" hidden>

                <div>
                    <h2>Your response has been recorded</h2>
                    <p>I'll be with you soon!</p>
                </div>

            </div>

            <!-- CONTACT INFORMATION -->
